name: Build DeepWarden APK

# Builds the DeepWarden Android app entirely in the cloud so it can be tested
# without a local computer: runs the unit-test suite, builds a debug APK, and
# uploads the APK as a downloadable artifact (installable on a phone).
on:
  push:
    branches:
      - claude/phantomguard-deepforge-android-ul4zvz
    paths:
      - 'deepwarden/**'
      - '.github/workflows/build-deepwarden.yml'
  workflow_dispatch:

# Needed so the build can publish the APK as a downloadable GitHub Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deepwarden
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests (scoring, parsers, data-safety guarantees)
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      # Build a properly release-signed APK using the committed stable keystore.
      # A real signature (vs the debug key) is what stops Play Protect from
      # hard-blocking the sideloaded install. SMS and all permissions are kept.
      # The keystore is committed deliberately for reproducible, update-safe
      # personal builds; it is NOT a Play Store upload key.
      - name: Build signed release APK
        env:
          DW_KEYSTORE_PATH: ${{ github.workspace }}/deepwarden/app/deepwarden-release.jks
          DW_STORE_PASSWORD: deepwarden
          DW_KEY_ALIAS: deepwarden
          DW_KEY_PASSWORD: deepwarden
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK for clarity
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/out/DeepWarden.apk"

      - name: Upload signed APK (Actions artifact)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: deepwarden-release-apk
          path: ${{ runner.temp }}/out/DeepWarden.apk
          if-no-files-found: error

      # Publish the signed APK as a GitHub Release asset — a direct, tappable
      # download on a phone (no zip, no login, visible in the GitHub mobile app).
      - name: Publish APK to a GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deepwarden-latest
          name: DeepWarden — latest build
          body: |
            Latest DeepWarden APK, built and **release-signed** automatically
            from the `claude/phantomguard-deepforge-android-ul4zvz` branch.
            SMS message-scanning (Layer 6) is included.

            **Install on a phone:** tap `DeepWarden.apk` below to download,
            then open it and allow "install unknown apps".

            If Play Protect still warns, open Play Store → profile → Play
            Protect → settings (gear) → turn off scanning, install, turn it
            back on.
          files: ${{ runner.temp }}/out/DeepWarden.apk
          make_latest: true

      - name: Upload test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deepwarden-test-report
          path: deepwarden/app/build/reports/tests/**
          if-no-files-found: ignore
