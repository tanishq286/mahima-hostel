name: Build DeepWarden APK

# Builds the DeepWarden Android app entirely in the cloud so it can be tested
# without a local computer: runs the unit-test suite, builds a debug APK, and
# uploads the APK as a downloadable artifact (installable on a phone).
on:
  push:
    branches:
      - claude/phantomguard-deepforge-android-ul4zvz
    paths:
      - 'deepwarden/**'
      - '.github/workflows/build-deepwarden.yml'
  workflow_dispatch:

# Needed so the build can publish the APK as a downloadable GitHub Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deepwarden
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests (scoring, parsers, data-safety guarantees)
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK (Actions artifact)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: deepwarden-debug-apk
          path: deepwarden/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Publish the APK as a GitHub Release asset — a direct, tappable download
      # on a phone (no zip, no login, visible in the GitHub mobile app).
      - name: Publish APK to a GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deepwarden-latest
          name: DeepWarden — latest debug build
          body: |
            Latest DeepWarden debug APK, built automatically from the
            `claude/phantomguard-deepforge-android-ul4zvz` branch.

            **Install on a phone:** tap `app-debug.apk` below to download,
            then open it and allow "install unknown apps".

            This is a debug build for personal testing.
          files: deepwarden/app/build/outputs/apk/debug/*.apk
          make_latest: true

      - name: Upload test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deepwarden-test-report
          path: deepwarden/app/build/reports/tests/**
          if-no-files-found: ignore
