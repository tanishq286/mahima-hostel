name: Build DeepWarden APK

# Builds the DeepWarden Android app entirely in the cloud so it can be tested
# without a local computer: runs the unit-test suite, builds a debug APK, and
# uploads the APK as a downloadable artifact (installable on a phone).
on:
  push:
    branches:
      - claude/phantomguard-deepforge-android-ul4zvz
    paths:
      - 'deepwarden/**'
      - '.github/workflows/build-deepwarden.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deepwarden
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests (scoring, parsers, data-safety guarantees)
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: deepwarden-debug-apk
          path: deepwarden/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deepwarden-test-report
          path: deepwarden/app/build/reports/tests/**
          if-no-files-found: ignore
